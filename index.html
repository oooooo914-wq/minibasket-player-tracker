<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>MiniBasket Player Tracker</title>
</head>
<body>
  <main class="app">
    <header>
      <h1>MiniBasket Player Tracker</h1>
      <p>動画を選び、追いたい選手をタップしてください。</p>
    </header>

    <section class="controls">
      <label class="file-button">
        動画を選ぶ
        <input id="videoInput" type="file" accept="video/*" hidden />
      </label>
      <button id="loadAiBtn" type="button">AIを準備</button>
      <button id="resetBtn" type="button">追跡をリセット</button>
    </section>

    <p id="status" class="status">動画を選んでください。</p>

    <section class="stage" id="stage">
      <video id="video" controls playsinline></video>
      <canvas id="overlay"></canvas>
    </section>

    <section class="info">
      <div><strong>対象:</strong> <span id="targetInfo">未選択</span></div>
      <div><strong>AI:</strong> <span id="aiInfo">未準備</span></div>
      <div><strong>検出:</strong> <span id="detectInfo">0人</span></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
